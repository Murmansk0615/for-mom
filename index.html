<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#05060d">
<meta name="renderer" content="webkit">
<meta name="x5-page-mode" content="app">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>祝妈妈生日快乐</title>
<style>
  html,body{height:100%;margin:0;background:#05060d;overflow:hidden;
    font-family:"STKaiti","KaiTi","Kaiti SC","Songti SC","Noto Serif SC",serif;
    -webkit-tap-highlight-color:transparent}
  #sky{display:block;width:100%;height:100%;cursor:crosshair;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}

  /* 微信内提示 */
  .wxTip{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);
    max-width:82vw;text-align:center;font-size:12px;line-height:1.7;letter-spacing:1px;
    color:rgba(246,214,146,.75);background:rgba(10,10,20,.55);
    border:1px solid rgba(246,214,146,.22);border-radius:10px;padding:8px 14px;
    pointer-events:none;opacity:1;transition:opacity .8s}
  .wxTip.gone{opacity:0}

  /* 暗角，让画面更聚焦 */
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%)}

  /* 点击提示 */
  .hint{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);
    color:#f6e0a8;font-size:15px;letter-spacing:6px;text-indent:6px;
    text-shadow:0 0 18px rgba(255,190,90,.55);pointer-events:none;
    animation:breathe 2.6s ease-in-out infinite;transition:opacity .5s;white-space:nowrap}
  .hint.gone{opacity:0}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

  /* 艺术字 */
  .wish{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);
    width:100%;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s}
  .wish.show{opacity:1}
  .line{display:block;white-space:nowrap}
  .ch{display:inline-block;opacity:0;transform:translateY(30px) scale(.82);
    /* 兜底：不支持渐变文字的内核（老版安卓微信）保持实心金，不会变隐形 */
    color:#f7d98f;
    filter:drop-shadow(0 2px 14px rgba(255,190,80,.45)) drop-shadow(0 0 44px rgba(255,140,40,.30)) blur(12px);
    animation:none;
    font-size:clamp(40px,8.6vw,104px);
    line-height:1.18;
    letter-spacing:.04em;
    padding:0 .02em;
  }
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .ch{
      background:linear-gradient(180deg,#fffdf2 0%,#ffe9a8 34%,#f5c25e 58%,#d9952f 78%,#ffeec0 100%);
      background-size:100% 220%;
      -webkit-background-clip:text;background-clip:text;
      color:transparent;-webkit-text-fill-color:transparent;
    }
  }
  .wish.show .ch{animation:pop 1.05s cubic-bezier(.18,.85,.25,1) forwards}
  @keyframes pop{
    0%{opacity:0;transform:translateY(30px) scale(.82);filter:blur(12px) drop-shadow(0 0 0 rgba(0,0,0,0))}
    55%{opacity:1;transform:translateY(-6px) scale(1.06);filter:blur(0) drop-shadow(0 2px 18px rgba(255,200,90,.65)) drop-shadow(0 0 60px rgba(255,150,50,.45))}
    100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0) drop-shadow(0 2px 14px rgba(255,190,80,.45)) drop-shadow(0 0 44px rgba(255,140,40,.30))}
  }

  .sub{display:block;margin-top:18px;opacity:0;transform:translateY(10px);
    font-size:clamp(11px,1.7vw,15px);letter-spacing:.55em;text-indent:.55em;
    color:#e8c98a;text-shadow:0 0 16px rgba(255,190,90,.5)}
  .wish.show .sub{animation:subUp 1.2s ease forwards}
  @keyframes subUp{to{opacity:.92;transform:translateY(0)}}

  .rule{display:block;height:1px;width:0;margin:22px auto 0;
    background:linear-gradient(90deg,transparent,rgba(246,214,146,.85),transparent)}
  .wish.show .rule{animation:grow 1.4s ease forwards}
  @keyframes grow{to{width:min(70vw,520px)}}

  .tip{display:block;margin-top:16px;font-size:12px;letter-spacing:.32em;text-indent:.32em;
    color:rgba(246,214,146,.6);opacity:0}
  .wish.show .tip{animation:subUp 1.1s ease 1.8s forwards}

  /* 重放 */
  .again{position:fixed;left:50%;bottom:6%;transform:translateX(-50%);
    background:transparent;border:1px solid rgba(246,214,146,.45);color:#f6d692;
    padding:9px 24px;border-radius:30px;font-size:13px;letter-spacing:3px;
    font-family:inherit;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s,background .25s}
  .again.show{opacity:1;pointer-events:auto}
  .again:hover{background:rgba(246,214,146,.12)}

  @media (prefers-reduced-motion: reduce){
    .ch{filter:none}
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="vignette"></div>

<div class="hint" id="hint">点 击 烟 花 筒 点 燃</div>

<div class="wish" id="wish">
  <span class="line" id="line"></span>
  <span class="sub">HAPPY&nbsp;BIRTHDAY&nbsp;MOM</span>
  <span class="rule"></span>
  <span class="tip">轻 点 画 面 · 再 放 一 朵</span>
</div>

<button class="again" id="again">再 放 一 次</button>

<script>
(function () {
  'use strict';

  var TEXT = '祝妈妈生日快乐';
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var hint = document.getElementById('hint');
  var wish = document.getElementById('wish');
  var lineEl = document.getElementById('line');
  var againBtn = document.getElementById('again');

  var W = 0, H = 0, DPR = 1;
  var stars = [];
  var rockets = [];
  var particles = [];
  var sparks = [];
  var tube = { x: 0, y: 0, w: 46, h: 96 };
  var phase = 'idle';           // idle | lighting | firing | done
  var startTime = 0;

  var PALETTE = [
    { h: 45, s: 100, l: 62 },   // 金
    { h: 12, s: 92,  l: 62 },   // 橘红
    { h: 330, s: 78, l: 66 },   // 玫红
    { h: 195, s: 88, l: 66 },   // 青
    { h: 268, s: 76, l: 72 },   // 紫
    { h: 52,  s: 100, l: 82 }   // 淡金白
  ];

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    tube.w = Math.max(36, Math.min(54, W * 0.075));
    tube.h = tube.w * 2.05;
    tube.x = W / 2;
    tube.y = H - Math.max(34, H * 0.05);

    buildStars();
  }

  function buildStars() {
    stars = [];
    var count = Math.round((W * H) / 14000);
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.82,
        r: Math.random() * 1.15 + 0.25,
        a: Math.random() * 0.55 + 0.25,
        ph: Math.random() * Math.PI * 2,
        sp: 0.6 + Math.random() * 1.6
      });
    }
  }

  /* ---------------- 烟花筒 ---------------- */

  function drawTube(t) {
    var x = tube.x, y = tube.y, w = tube.w, h = tube.h;
    var top = y - h;

    // 落地光
    var g0 = ctx.createRadialGradient(x, y + 2, 2, x, y + 2, w * 2.6);
    g0.addColorStop(0, 'rgba(255,190,90,.16)');
    g0.addColorStop(1, 'rgba(255,190,90,0)');
    ctx.fillStyle = g0;
    ctx.beginPath();
    ctx.ellipse(x, y + 2, w * 2.6, w * 0.9, 0, 0, Math.PI * 2);
    ctx.fill();

    // 筒身（微微上宽下窄）
    var tw = w * 0.92;
    var grad = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    grad.addColorStop(0, '#3a1013');
    grad.addColorStop(0.28, '#a3242c');
    grad.addColorStop(0.55, '#d0383f');
    grad.addColorStop(0.78, '#8e1c22');
    grad.addColorStop(1, '#2c0b0e');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x - tw / 2, top + 3);
    ctx.lineTo(x + tw / 2, top + 3);
    ctx.lineTo(x + w / 2, y);
    ctx.lineTo(x - w / 2, y);
    ctx.closePath();
    ctx.fill();

    // 金色缠带
    ctx.strokeStyle = 'rgba(226,182,96,.85)';
    ctx.lineWidth = 2;
    for (var i = 0; i < 3; i++) {
      var yy = top + 12 + i * (h * 0.3);
      var halfW = (tw / 2) + (w - tw) / 2 * ((yy - top) / h);
      ctx.beginPath();
      ctx.moveTo(x - halfW + 2, yy);
      ctx.lineTo(x + halfW - 2, yy);
      ctx.stroke();
    }

    // 筒口
    ctx.fillStyle = '#1a0a0c';
    ctx.beginPath();
    ctx.ellipse(x, top + 3, tw / 2, tw * 0.17, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(226,182,96,.9)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // 高光
    var hl = ctx.createLinearGradient(x - w * 0.3, 0, x - w * 0.05, 0);
    hl.addColorStop(0, 'rgba(255,255,255,0)');
    hl.addColorStop(0.5, 'rgba(255,235,200,.22)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl;
    ctx.fillRect(x - w * 0.32, top + 6, w * 0.22, h - 10);

    // 引信
    ctx.strokeStyle = 'rgba(230,220,190,.8)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(x + 2, top + 1);
    ctx.quadraticCurveTo(x + 12, top - 10, x + 6, top - 20);
    ctx.stroke();

    if (phase === 'lighting') {
      var fl = 0.5 + Math.random() * 0.5;
      ctx.globalCompositeOperation = 'lighter';
      var fg = ctx.createRadialGradient(x + 6, top - 20, 0, x + 6, top - 20, 16 * fl);
      fg.addColorStop(0, 'rgba(255,255,220,.95)');
      fg.addColorStop(0.35, 'rgba(255,190,70,.75)');
      fg.addColorStop(1, 'rgba(255,120,20,0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.arc(x + 6, top - 20, 16 * fl, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  /* ---------------- 火箭与粒子 ---------------- */

  function launchShell(delay) {
    var targetY = H * (0.16 + Math.random() * 0.22);
    rockets.push({
      x: tube.x + (Math.random() - 0.5) * 8,
      y: tube.y - tube.h + 2,
      vx: (Math.random() - 0.5) * 1.2,
      vy: -(H * 0.0135) - Math.random() * 1.6,
      targetY: targetY,
      hue: PALETTE[(Math.random() * PALETTE.length) | 0].h,
      t: -delay || 0,
      trail: []
    });
  }

  function explode(r) {
    var p = PALETTE[(Math.random() * PALETTE.length) | 0];
    var hue = r.hue != null ? r.hue : p.h;
    var kind = Math.random();
    var n = 90 + ((Math.random() * 70) | 0);
    var ring = kind < 0.18;
    var willow = !ring && kind > 0.78;
    var baseSpeed = ring ? 3.6 : 2.4 + Math.random() * 3.4;

    for (var i = 0; i < n; i++) {
      var ang = ring ? (i / n) * Math.PI * 2 : Math.random() * Math.PI * 2;
      var sp = ring ? baseSpeed + Math.random() * 0.35
                    : baseSpeed * (0.35 + Math.random() * 0.85);
      var h2 = hue + (Math.random() - 0.5) * (willow ? 10 : 32);
      particles.push({
        x: r.x, y: r.y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        hue: h2,
        life: (willow ? 150 : 72) + Math.random() * 46,
        max: willow ? 150 : 118,
        size: willow ? 1.1 + Math.random() * 1.1 : 1.4 + Math.random() * 1.9,
        grav: willow ? 0.012 : 0.034,
        drag: willow ? 0.992 : 0.977,
        tw: Math.random() * 6.28
      });
    }

    // 闪光核
    particles.push({
      x: r.x, y: r.y, vx: 0, vy: 0, hue: hue,
      life: 16, max: 16, size: 26, grav: 0, drag: 1, tw: 0, flash: true
    });
  }

  function updateRockets(dt) {
    for (var i = rockets.length - 1; i >= 0; i--) {
      var r = rockets[i];
      if (r.t < 0) { r.t += dt; continue; }
      r.x += r.vx * dt;
      r.y += r.vy * dt;
      r.vy += 0.085 * dt;

      r.trail.push({ x: r.x, y: r.y, a: 1 });
      if (r.trail.length > 14) r.trail.shift();

      // 尾焰碎屑
      if (Math.random() < 0.75) {
        sparks.push({
          x: r.x, y: r.y,
          vx: (Math.random() - 0.5) * 0.7,
          vy: 0.5 + Math.random() * 1.2,
          life: 12 + Math.random() * 12, max: 24, hue: 40
        });
      }

      if (r.vy >= -0.6 || r.y <= r.targetY) {
        explode(r);
        rockets.splice(i, 1);
      }
    }
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.pow(p.drag, dt);
      p.vy *= Math.pow(p.drag, dt);
      p.vy += p.grav * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (var j = sparks.length - 1; j >= 0; j--) {
      var s = sparks[j];
      s.x += s.vx; s.y += s.vy;
      s.vy += 0.03;
      s.life -= dt;
      if (s.life <= 0) sparks.splice(j, 1);
    }
  }

  function drawFireworks() {
    ctx.globalCompositeOperation = 'lighter';

    for (var i = 0; i < rockets.length; i++) {
      var r = rockets[i];
      if (r.t < 0) continue;
      for (var k = 0; k < r.trail.length; k++) {
        var tp = r.trail[k];
        var ta = (k / r.trail.length) * 0.5;
        ctx.fillStyle = 'hsla(42,100%,78%,' + ta + ')';
        ctx.beginPath();
        ctx.arc(tp.x, tp.y, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,240,200,.95)';
      ctx.beginPath();
      ctx.arc(r.x, r.y, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }

    for (var p = 0; p < particles.length; p++) {
      var q = particles[p];
      var lifeT = q.life / q.max;
      if (q.flash) {
        var fg = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.size);
        fg.addColorStop(0, 'hsla(' + q.hue + ',100%,95%,' + (lifeT * 0.95) + ')');
        fg.addColorStop(0.4, 'hsla(' + q.hue + ',100%,70%,' + (lifeT * 0.5) + ')');
        fg.addColorStop(1, 'hsla(' + q.hue + ',100%,60%,0)');
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.arc(q.x, q.y, q.size, 0, Math.PI * 2);
        ctx.fill();
        continue;
      }
      var tw = 0.72 + 0.28 * Math.sin(q.tw + q.life * 0.35);
      var alpha = Math.max(0, lifeT) * tw;
      ctx.fillStyle = 'hsla(' + q.hue + ',100%,' + (58 + 30 * lifeT) + '%,' + alpha + ')';
      ctx.beginPath();
      ctx.arc(q.x, q.y, q.size * (0.6 + 0.7 * lifeT), 0, Math.PI * 2);
      ctx.fill();
    }

    for (var s = 0; s < sparks.length; s++) {
      var sp = sparks[s];
      ctx.fillStyle = 'hsla(' + sp.hue + ',100%,72%,' + (sp.life / sp.max) * 0.9 + ')';
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  function drawStars(t) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = s.a * (0.55 + 0.45 * Math.sin(t * 0.001 * s.sp + s.ph));
      ctx.fillStyle = 'rgba(230,240,255,' + a + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ---------------- 主循环 ---------------- */

  var last = 0;
  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(2.4, (now - last) / 16.67);
    last = now;

    // 拖尾：半透明覆盖
    ctx.fillStyle = 'rgba(5,6,13,0.22)';
    ctx.fillRect(0, 0, W, H);

    drawStars(now);

    updateRockets(dt);
    updateParticles(dt);
    drawFireworks();

    drawTube(now);

    requestAnimationFrame(frame);
  }

  /* ---------------- 流程 ---------------- */

  function buildText() {
    lineEl.innerHTML = '';
    for (var i = 0; i < TEXT.length; i++) {
      var span = document.createElement('span');
      span.className = 'ch';
      span.textContent = TEXT[i];
      span.style.animationDelay = (i * 0.13) + 's';
      lineEl.appendChild(span);
    }
  }

  function ignite() {
    if (phase !== 'idle') return;
    phase = 'lighting';
    hint.classList.add('gone');
    startTime = performance.now();

    // 引信火星
    var topY = tube.y - tube.h;
    for (var i = 0; i < 26; i++) {
      sparks.push({
        x: tube.x + 6 + (Math.random() - 0.5) * 4,
        y: topY - 20,
        vx: (Math.random() - 0.5) * 2.2,
        vy: -Math.random() * 1.8,
        life: 18 + Math.random() * 16, max: 34, hue: 42
      });
    }

    setTimeout(function () {
      phase = 'firing';
      var n = 7;
      for (var k = 0; k < n; k++) launchShell(k * 9 + Math.random() * 5);
      setTimeout(showWish, 3000);
    }, 620);
  }

  function showWish() {
    wish.classList.add('show');
    phase = 'done';
    setTimeout(function () { againBtn.classList.add('show'); }, 1400);
  }

  function reset() {
    particles.length = 0;
    rockets.length = 0;
    sparks.length = 0;
    wish.classList.remove('show');
    againBtn.classList.remove('show');
    hint.classList.remove('gone');
    phase = 'idle';
    // 重建字符节点即可让 CSS 动画重新触发，切勿写成内联 animation:none（会永久覆盖动画）
    buildText();
  }

  /** 首轮齐射结束后：每次点击只放一发，不点不放 */
  function pop() {
    if (phase === 'firing' || phase === 'lighting') return;
    launchShell(0);
  }

  canvas.addEventListener('pointerdown', function () {
    if (phase === 'idle') ignite();
    else if (phase === 'done') pop();
  });

  // 老版安卓微信内核可能没有 Pointer Events，用 touch 兜底
  if (!window.PointerEvent) {
    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      if (phase === 'idle') ignite();
      else if (phase === 'done') pop();
    }, { passive: false });
  }

  // 微信里长按不弹菜单
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // 微信内置浏览器：给一条"打不开怎么办"的提示，7 秒后淡出
  if (/MicroMessenger/i.test((navigator.userAgent || ''))) {
    var tip = document.createElement('div');
    tip.className = 'wxTip';
    tip.textContent = '若无反应，点右上角 ⋯ 选择「在浏览器打开」';
    document.body.appendChild(tip);
    setTimeout(function () { tip.classList.add('gone'); }, 7000);
  }

  window.addEventListener('keydown', function (e) {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    if (phase === 'idle') ignite();
    else if (phase === 'done') pop();
  });

  againBtn.addEventListener('click', function () {
    reset();
    // 重放时强制重排，让 CSS 动画重新触发
    void lineEl.offsetWidth;
    setTimeout(ignite, 120);
  });

  window.addEventListener('resize', resize);

  resize();
  buildText();
  requestAnimationFrame(frame);

  // 只读调试钩子（供自动化测试断言，不影响运行）
  window.__fw = {
    get phase() { return phase; },
    get rockets() { return rockets.length; },
    get particles() { return particles.length; }
  };
})();
</script>
</body>
</html>
